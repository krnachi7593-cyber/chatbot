services:
  - type: web
    name: shopmate-ai
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shopmate-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: LLM_ENABLED
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: GROQ_WEB_SEARCH_ENABLED
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://shopmate-ai.onrender.com"
databases:
  - name: shopmate-db
    region: singapore
    plan: free
    databaseName: shopmate
    user: shopmate
